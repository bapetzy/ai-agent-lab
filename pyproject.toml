[project]
name = "agentlab"
version = "0.1.0"
description = "BAPE-LAB AI Agent Laboratory: a small, fully observed agent kernel for learning how agents work"
authors = [
    { email = "bryan2306paulo@gmail.com" }
]
requires-python = ">=3.14"
# Core: Python standard library only (free-first, D-026/D-027).
dependencies = []

[project.optional-dependencies]
# Optional, off by default, never required: the external Anthropic adapter.
anthropic = ["anthropic>=1.11,<2"]

[project.scripts]
agent-lab = "agentlab.cli:main"

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: calls an external paid API (optional adapter; needs the anthropic extra, AGENTLAB_ENABLE_EXTERNAL_API=1 and a key). Deselected by default; never required.",
]
addopts = "-m 'not live'"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
