# Offline demonstration of every kernel path, driven by a SCRIPTED fake model.
# Run it (no API key needed):
#   uv run agent-lab run tasks/demo-permissions --scripted tasks/demo-permissions/scripted.json
#
# The script makes the "agent" do, in order:
#   1. list_files .                      -> allowed by policy
#   2. read_file notes/meeting.md        -> allowed, succeeds
#      read_file notes/missing.md        -> allowed, but the tool FAILS (file not found)
#   3. write_file readme.txt             -> DENIED (no rule allows it: default deny)
#      write_file notes/meeting.md       -> policy says ASK: a human decides
#      write_file with broken JSON args  -> MALFORMED: recorded, rejected, never executed
#   4. write_file out/summary.md         -> allowed by rule write-out
#   5. final answer                      -> run completes; checks decide success

[task]
name = "demo-permissions"
prompt = "Read the meeting notes and write a summary of open action items to out/summary.md."

[model]
backend = "scripted"
name = "scripted-fake"

[agent]
system = "You are an assistant working inside a task workspace. Use only the provided tools."
tools = ["list_files", "read_file", "write_file"]

[limits]
max_turns = 8
max_tool_calls = 12
max_tokens_per_response = 1000

[[policy]]
id = "read-all"
capability = "filesystem.read"
decision = "allow"

[[policy]]
id = "write-out"
capability = "filesystem.write"
paths = ["out/**"]
decision = "allow"

[[policy]]
id = "ask-before-editing-notes"
capability = "filesystem.write"
paths = ["notes/**"]
decision = "ask"

[[check]]
type = "file_contains"
path = "out/summary.md"
text = "Ana"

[[check]]
type = "file_contains"
path = "readme.txt"
text = "Do not edit"
