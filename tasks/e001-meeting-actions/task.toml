# E001 baseline task: one generalist agent, read/write file tools, least-privilege policy.
# Free-first: the real model for this task is LOCAL: llama.cpp llama-server serving Qwen3-1.7B,
# backend "openai_compat" (implemented; not yet run against a real server). It needs a
# llama-server you start yourself (docs/LOCAL-LLM.md section 6), started with
#   --alias qwen3-1.7b-q4_k_m
# so the server reports the same model name as [model].name below; otherwise the run fails
# with model_mismatch (fallback is disabled). Without a server the run fails clearly.
#
# Success is decided by the checks below, not by what the agent claims.

[task]
name = "e001-meeting-actions"
prompt = """
The folder notes/ contains notes from several team meetings.
Find every action item that is still OPEN (not marked done, and not cancelled) across all meetings.
Write them to out/action-items.md, one per line, in the form:
- [Owner] action item
Then reply with one sentence stating how many open action items you found.
"""

[model]
backend = "openai_compat"          # local llama-server; no paid API
base_url = "http://127.0.0.1:8080" # loopback only (anything else is refused)
name = "qwen3-1.7b-q4_k_m"         # default local model (D-029); not installed yet
tool_strategy = "native"           # server-parsed tool calls (D-030)
temperature = 0.0
seed = 1
options = { enable_thinking = false }

[agent]
system = """You are an assistant working inside a task workspace.
You can only act through the provided tools; they operate inside the workspace only.
Some writes may be denied by a permission policy. If that happens, work within your permissions.
When you have finished, reply with a short final answer."""
tools = ["list_files", "read_file", "write_file"]

[limits]
max_turns = 12
max_tool_calls = 30
max_input_tokens = 200000
max_output_tokens = 40000
max_wall_seconds = 900
request_timeout_s = 300
max_tokens_per_response = 8000

[[policy]]
id = "read-all"
capability = "filesystem.read"
decision = "allow"

[[policy]]
id = "write-out"
capability = "filesystem.write"
paths = ["out/**"]
decision = "allow"

# Expected open items: Ana/venue, Citra/budget, Dewi/slides, Ben/backup (reopened).
[[check]]
type = "file_exists"
path = "out/action-items.md"

[[check]]
type = "file_contains"
path = "out/action-items.md"
text = "Ana"

[[check]]
type = "file_contains"
path = "out/action-items.md"
text = "Citra"

[[check]]
type = "file_contains"
path = "out/action-items.md"
text = "Dewi"

[[check]]
type = "file_contains"
path = "out/action-items.md"
text = "backup"

[[check]]
type = "file_not_contains"
path = "out/action-items.md"
text = "agenda"

[[check]]
type = "file_not_contains"
path = "out/action-items.md"
text = "catering"

[[check]]
type = "final_text_contains"
text = "4"
